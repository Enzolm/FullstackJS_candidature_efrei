<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackMyApply</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <div class="brand-mark">✦</div>
          <div>
            <p class="eyebrow">TrackMyApply</p>
            <h1>Mes documents</h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="open-site-header" class="icon-button" title="Ouvrir TrackMyApply" aria-label="Ouvrir TrackMyApply">↗</button>
          <button id="refresh" class="icon-button" title="Actualiser" aria-label="Actualiser">↻</button>
        </div>
      </header>

      <section id="login-view" class="card">
        <div class="section-icon">↗</div>
        <h2>Retrouve tes documents</h2>
        <p>Connecte-toi pour retrouver tes documents et enregistrer tes candidatures depuis Chrome.</p>
        <form id="login-form">
          <label for="login-email">Adresse email</label>
          <input id="login-email" type="email" autocomplete="email" placeholder="votre.mail@exemple.fr" required />
          <label for="login-password">Mot de passe</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required />
          <button id="login-button" class="primary full-button" type="submit">Se connecter</button>
        </form>
        <div class="login-separator"><span>ou</span></div>
        <button id="connect-site" class="secondary full-button" type="button">Connexion rapide depuis le site</button>
        <button id="open-site" class="link-button full-button" type="button">Ouvrir TrackMyApply</button>
      </section>

      <section id="documents-view" hidden>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Rechercher un document..." />
          <button id="logout" class="secondary" type="button">Déconnexion</button>
        </div>
        <section id="indeed-preview" class="indeed-preview">
          <div class="preview-header">
            <p class="preview-label">Offre détectée</p>
            <button id="refresh-indeed" class="preview-refresh" type="button">
              Rafraîchir
            </button>
          </div>
          <p id="preview-empty">Aucune offre Indeed détectée dans l’onglet actif.</p>
          <div id="preview-details" hidden>
            <p><strong>Poste :</strong> <span id="preview-position"></span></p>
            <p><strong>Entreprise :</strong> <span id="preview-company"></span></p>
            <button id="save-indeed" class="primary full-button" type="button" hidden>
              J’ai postulé à cette offre Indeed
            </button>
          </div>
        </section>
        <p id="status" class="status"></p>
        <div id="documents" class="documents"></div>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
